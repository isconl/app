<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="iSconl sovereign personal agent console.">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iSconl">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iSconl · Sovereign Console</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0d1117;margin:0;">
  <!--
    BI26102013: a real DOM element painted before Flutter starts. Flutter draws to a canvas, so a browser has no
    text or image to call the largest contentful paint and the page scored no performance number at all. This splash
    is that element, and it is removed on the first Flutter frame.
  -->
  <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
    <div style="font-size:40px;font-weight:800;letter-spacing:-1px;">iSconl</div>
    <div style="margin-top:8px;font-size:15px;color:#8b949e;">Sovereign console</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // BI26101513: the passkeys package registers itself when the app starts and calls into corbado's Passkeys Web SDK,
    // which this build does not bundle. Without a stand-in the registration throws and the page closes itself, so the
    // web app never started. Passkeys are not offered on web (PlatformPasskeyClient.available is false there), so a
    // no-op init is all the registration needs.
    if (!window.PasskeyAuthenticator) window.PasskeyAuthenticator = { init: function () {} };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
