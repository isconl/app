# BI26100705: TEMPORARY. Regenerates the two dark module goldens on Linux (pixel
# goldens are font-engine specific and only checked on Linux) and uploads them as
# an artifact, so they can be looked at before they are committed. Removed from
# the branch before the PR merges.
name: tmp update goldens

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-update-goldens.yml'

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Regenerate the module goldens
        run: flutter test --update-goldens --plain-name "golden: artefact-free module (dark)" test/module_render_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: module-goldens
          path: test/goldens/
