name: isconl
description: "iSconl - sovereign personal agent, native client for Android, Windows and Linux. Offline-first mirror of the web dashboard."
publish_to: 'none'

# Version is auto-bumped by CI on every build (patch +1). This one is a hand
# minor bump: the client caught up with three days of agent work (Ideas, Rhythm,
# Files, Buffer, Articles, PIN sign-in, agent-served updates), which is more than
# a patch admits to.
version: 0.1.3+6

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.0.0
  # Course audio. flutter_tts is the free, offline, always-available default and
  # works on every module including the plane-B ones, because nothing leaves the
  # device. just_audio plays the agent's ElevenLabs narration - chosen over
  # audioplayers because it supports auth headers and HTTP range requests, and
  # /api/learning/audio is Bearer-gated and seekable.
  flutter_tts: ^4.2.0
  just_audio: ^0.9.42
  sqflite_common_ffi_web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
